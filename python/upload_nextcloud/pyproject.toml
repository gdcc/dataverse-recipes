[project]
name = "nc-transfer"
version = "0.1.0"
description = "A tool to transfer files from Nextcloud link shares to Dataverse datasets"
authors = [
    {name = "Oliver Bertuch", email = "o.bertuch@fz-juelich.de"}
]
readme = "README.md"
requires-python = "<4.0.0,>=3.10"
dependencies = [
    "requests>=2.32.5",
    "pyDataverse>=0.3.5",
    "humanize>=4.13.0",
]

[project.scripts]
nc-transfer = "transfer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["transfer.py"]

[tool.poetry]
packages = [{include = "transfer.py"}]